<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Rental System</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header>
    <h1>Vehicle Rental System</h1>
    <p>Book, modify, and manage rentals with live availability status.</p>
  </header>

  <main>
    <section class="panel auth-panel">
      <h2>Register / Login</h2>
      <form id="registerForm">
        <input type="text" name="full_name" placeholder="Full name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <input type="text" name="phone" placeholder="Phone" />
        <button type="submit">Register</button>
      </form>

      <form id="loginForm">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p id="authMessage"></p>
    </section>

    <section class="panel">
      <h2>Available Vehicles</h2>
      <div class="filters">
        <select id="categoryFilter">
          <option value="">All categories</option>
          <option value="Hatchback">Hatchback</option>
          <option value="Sedan">Sedan</option>
          <option value="SUV">SUV</option>
        </select>
        <button id="refreshVehicles">Refresh</button>
      </div>
      <div id="vehicleList" class="vehicle-grid"></div>
    </section>

    <section class="panel" id="bookingPanel">
      <h2>Booking Actions</h2>
      <form id="bookingForm">
        <input type="number" name="vehicle_id" placeholder="Vehicle ID" required />
        <input type="date" name="start_date" required />
        <input type="date" name="end_date" required />
        <button type="submit">Book Vehicle</button>
      </form>

      <form id="cancelForm">
        <input type="number" name="booking_id" placeholder="Booking ID" required />
        <input type="text" name="reason" placeholder="Cancellation reason" />
        <button type="submit">Cancel Booking</button>
      </form>

      <form id="modifyForm">
        <input type="number" name="booking_id" placeholder="Booking ID" required />
        <input type="date" name="new_start_date" required />
        <input type="date" name="new_end_date" required />
        <input type="text" name="reason" placeholder="Modification reason" />
        <button type="submit">Modify Booking</button>
      </form>
      <p id="bookingMessage"></p>
    </section>

    <section class="panel">
      <h2>Admin Monitoring</h2>
      <button id="loadDashboard">Load Dashboard</button>
      <pre id="dashboardOutput"></pre>
      <button id="loadFinalBookings">Show Final Bookings</button>
      <pre id="finalBookingsOutput"></pre>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
